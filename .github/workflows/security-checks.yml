name: Security regression checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject product artifacts in sources and new history
        env:
          AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$AUDIT_BASE" ] && [ "$AUDIT_BASE" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/audit_sources.py --base "$AUDIT_BASE"
          else
            python3 scripts/audit_sources.py
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate fake-data contracts and dependency update policy
        run: |
          python -m pip install -r requirements-dev.txt
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate configuration and secret rendering
        run: python3 scripts/validate.py
      - name: Validate LDAP TLS and ACL behavior
        run: python3 scripts/integration.py
      - name: Scan the resulting source tree for secrets
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir /repo --config /repo/.gitleaks.toml --redact --no-banner
